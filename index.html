<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0e1a">
    <title>CodeSynq Release Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#mainContent">Skip to content</a>

    <main class="shell" id="mainContent">
        <!-- Header -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">&#x2302;</span>
                <div>
                    <p class="eyebrow">CODESYNQ DESKTOP</p>
                    <h1>Release Manager</h1>
                </div>
            </div>
            <div class="header-right">
                <span id="connectionStatus" class="status" aria-live="polite">
                    <span class="status-dot"></span> Connecting…
                </span>
                <button id="refreshBtn" class="icon-btn" title="Refresh data" aria-label="Refresh data">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                </button>
            </div>
        </header>

        <!-- Public Update Endpoint -->
        <section class="card endpoint-card" aria-labelledby="endpointHeading">
            <p class="eyebrow" id="endpointHeading">UPDATE ENDPOINT</p>
            <div id="currentRelease" class="release-summary">No Windows release has been published.</div>
            <div id="endpointToast" class="toast" role="status" aria-live="polite"></div>
        </section>

        <!-- Release History -->
        <section id="historyCard" class="card hidden" aria-labelledby="historyHeading">
            <div class="card-heading">
                <p class="eyebrow" id="historyHeading">RELEASE HISTORY</p>
                <button id="clearHistory" class="secondary small" aria-label="Clear release history">Clear</button>
            </div>
            <div id="releaseHistory" class="release-history"></div>
        </section>

        <!-- Security Posture -->
        <section id="securityCard" class="card hidden" aria-labelledby="securityHeading">
            <p class="eyebrow" id="securityHeading">SECURITY POSTURE</p>
            <div id="securityStatus" class="security-grid"></div>
        </section>

        <!-- Admin Sign In -->
        <section id="loginCard" class="card auth-card" aria-labelledby="loginHeading">
            <h2 id="loginHeading">Administrator sign in</h2>
            <p>Only users marked <code>isAdmin: true</code> in Firebase can publish a release.</p>
            <form id="loginForm" novalidate>
                <label for="email">Email
                    <input id="email" type="email" autocomplete="email" required aria-required="true">
                </label>
                <label for="password">Password
                    <input id="password" type="password" autocomplete="current-password" required aria-required="true" minlength="6">
                </label>
                <button type="submit" id="loginButton">Sign in</button>
            </form>
            <p id="loginMessage" class="message" role="alert"></p>
        </section>

        <!-- Publisher Form -->
        <section id="publisherCard" class="card hidden" aria-labelledby="publisherHeading">
            <div class="card-heading">
                <div><p class="eyebrow">SIGNED IN AS</p><strong id="signedInEmail"></strong></div>
                <button id="signOut" class="secondary">Sign out</button>
            </div>
            <h2 id="publisherHeading">Publish Windows update</h2>
            <form id="releaseForm" novalidate>
                <div class="grid">
                    <label for="version">Version
                        <input id="version" placeholder="1.0.1" pattern="^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$" required aria-required="true">
                    </label>
                    <label for="mandatory">Update type
                        <select id="mandatory">
                            <option value="false">Optional</option>
                            <option value="true">Required</option>
                        </select>
                    </label>
                </div>
                <label for="downloadUrl">GitHub direct download URL
                    <input id="downloadUrl" type="url" placeholder="https://github.com/OWNER/REPO/releases/download/v1.0.1/CodeSynq-Setup-1.0.1.exe" required aria-required="true">
                </label>
                <label for="latestYmlUrl">GitHub latest.yml URL
                    <input id="latestYmlUrl" type="url" placeholder="https://github.com/OWNER/REPO/releases/download/v1.0.1/latest.yml" required aria-required="true">
                </label>
                <div class="grid">
                    <label for="sha512">SHA-512 checksum
                        <input id="sha512" placeholder="Base64-encoded SHA-512" required aria-required="true">
                    </label>
                    <label for="fileSize">Installer size (bytes)
                        <input id="fileSize" type="number" placeholder="Optional" min="0">
                    </label>
                </div>
                <label for="releaseNotes">Release notes
                    <textarea id="releaseNotes" rows="5" maxlength="4000" placeholder="What changed in this release?"></textarea>
                </label>
                <button type="submit" id="publishButton">Upload and publish release</button>
            </form>
            <div id="publishSpinner" class="spinner hidden" role="status" aria-label="Publishing"></div>
            <p id="publishMessage" class="message" role="status"></p>
        </section>
    </main>

    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="updater.js"></script>
</body>
</html>
