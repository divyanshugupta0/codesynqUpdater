<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d1117">
    <title>Create CodeSynq updater admin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="shell narrow">
        <a class="back-link" href="index.html">← Back to Release Manager</a>
        <section class="card auth-card">
            <p class="eyebrow">CODESYNQ DESKTOP</p>
            <h1>Create temporary admin</h1>
            <p>This temporary page immediately grants the new account permission to publish releases. Remove it or restore approval before making the portal public.</p>
            <form id="registerForm">
                <label>Name<input id="name" autocomplete="name" maxlength="80" required></label>
                <label>Email<input id="email" type="email" autocomplete="email" required></label>
                <label>Password<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
                <button id="registerButton" type="submit">Create administrator account</button>
            </form>
            <p id="registerMessage" class="message" role="status"></p>
        </section>
    </main>
    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="admin-register.js"></script>
</body>
</html>
